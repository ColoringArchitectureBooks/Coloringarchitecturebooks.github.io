<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Hospital 3D Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Deliberately single-theme: the model is a white coloring page, so the page stays paper-white. */
  :root { --paper:#ffffff; --ink:#1a1a1a; --muted:#6b6b6b; --chip:#f3f3f1; --line:#d9d9d6; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  header { position:fixed; top:0; left:0; right:0; padding:max(14px, env(safe-area-inset-top)) 16px 0;
    pointer-events:none; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1 { margin:0; font-size:17px; font-weight:700; letter-spacing:.01em; }
  .sub { margin-top:2px; font-size:13px; color:var(--muted); }
  .bar { position:fixed; left:50%; transform:translateX(-50%); bottom:max(16px, env(safe-area-inset-bottom));
    display:flex; gap:8px; }
  button { font:inherit; font-size:14px; border:1.5px solid var(--ink); background:var(--paper); color:var(--ink);
    border-radius:999px; padding:9px 16px; cursor:pointer; white-space:nowrap; }
  button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .hint { position:fixed; left:0; right:0; bottom:calc(max(16px, env(safe-area-inset-bottom)) + 52px);
    text-align:center; font-size:13px; color:var(--muted); pointer-events:none; transition:opacity .6s; }
  #status { position:fixed; inset:0; display:grid; place-items:center; font-size:15px; color:var(--muted); }
</style>

<canvas id="c"></canvas>
<header>
  <div>
    <h1>Hospital 3D Model</h1>
    <div class="sub">Coloring book · page 2</div>
  </div>
</header>
<div id="status">Loading the building…</div>
<div class="hint" id="hint" dir="rtl">اسحب بصباعك عشان تلف المستشفى، وقرّب بصباعين</div>
<div class="bar">
  <button id="spin" aria-pressed="false">Spin</button>
  <button id="front">Whole site</button>
  <button id="reset">Reset view</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const canvas = document.getElementById("c");
const status = document.getElementById("status");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.add(new THREE.HemisphereLight(0xffffff, 0xeeeeee, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(-20, 40, 35);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 1500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 8;
controls.maxDistance = 400;
controls.maxPolarAngle = Math.PI / 2 - 0.03;   // stay above the ground
controls.autoRotateSpeed = 1.2;
// Two-finger touch, the same as the train station: move both fingers together to turn the model (down = view from above,
// up = toward the ground, sideways = round), pinch to zoom toward the point between the fingers, twist to turn about it.
function mapTouch(controls, camera, canvas, scene) {
  controls.touches.TWO = -1;                                 // OrbitControls leaves two-finger gestures to this code
  const pts = new Map();                                     // pointerId -> {x, y}
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), up = new THREE.Vector3(0, 1, 0);
  let g = null, multi = false, raf = 0, glide = 0;           // gesture in progress; did this touch use two fingers; frame requests

  const two = () => [...pts.values()];
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
  const wrap = (x) => Math.atan2(Math.sin(x), Math.cos(x)); // keep a turn between -180° and 180°
  function rayAt(p) {
    const r = canvas.getBoundingClientRect();
    ndc.set((p.x - r.left) / r.width * 2 - 1, -(p.y - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera); return ray.ray;
  }
  function anchorAt(p) {                                     // the spot on the model under the fingers
    const R = rayAt(p);
    const hit = ray.intersectObjects(scene.children, true).find((h) => h.object.isMesh && h.object.visible);
    if (hit) return hit.point.clone();
    return R.at(camera.position.distanceTo(controls.target), new THREE.Vector3());
  }

  // move the whole view about P: zoom by k, twist by th, and turn like one finger by a drag of (dx, dy) pixels
  function step(P, k, th, dx, dy) {
    const cam = camera.position, tgt = controls.target, d0 = cam.distanceTo(tgt), h = canvas.clientHeight || 1;
    k = THREE.MathUtils.clamp(k, controls.minDistance / d0, controls.maxDistance / d0);
    cam.sub(P).multiplyScalar(k).add(P); tgt.sub(P).multiplyScalar(k).add(P);
    // round about the upright line through P: the twist, plus a sideways drag at one-finger speed
    const q = new THREE.Quaternion().setFromAxisAngle(up, th - 2 * Math.PI * dx / h * controls.rotateSpeed);
    cam.sub(P).applyQuaternion(q).add(P); tgt.sub(P).applyQuaternion(q).add(P);
    // over the top: a drag down rises to look from above, a drag up sinks toward the ground (as with one finger)
    const off = cam.clone().sub(tgt), phi = Math.acos(THREE.MathUtils.clamp(off.y / off.length(), -1, 1));
    const nphi = THREE.MathUtils.clamp(phi - 2 * Math.PI * dy / h * controls.rotateSpeed, 0.03, controls.maxPolarAngle);
    if (Math.abs(nphi - phi) > 1e-5) {
      const axis = new THREE.Vector3().crossVectors(up, off).normalize(), qt = new THREE.Quaternion().setFromAxisAngle(axis, phi - nphi);
      const o2 = off.clone().applyQuaternion(qt);
      if (Math.abs(Math.acos(THREE.MathUtils.clamp(o2.y / o2.length(), -1, 1)) - nphi) > 1e-3) qt.setFromAxisAngle(axis, nphi - phi);
      cam.sub(P).applyQuaternion(qt).add(P); tgt.sub(P).applyQuaternion(qt).add(P);
      if (cam.y < 0.3) { const lift = 0.3 - cam.y; cam.y += lift; tgt.y += lift; }   // never below the ground
    }
    if (tgt.y < -3) {                                        // the aim point (what one finger turns about) sank well under the ground: bring it up to the ground
      const d = cam.distanceTo(tgt), R = new THREE.Ray(cam.clone(), tgt.clone().sub(cam).normalize()), G = R.intersectPlane(new THREE.Plane(up, 0.6), new THREE.Vector3());
      if (G && G.distanceTo(cam) > 0.5 * d) tgt.copy(G);
    }
    camera.lookAt(tgt); controls.update();
  }

  function start() {
    cancelAnimationFrame(glide); glide = 0;
    const [a, b] = two();
    g = { a: { ...a }, b: { ...b }, P: anchorAt(mid(a, b)), v: { k: 1, th: 0, x: 0, y: 0 }, t: performance.now() };
    controls.autoRotate = false; document.getElementById("spin")?.setAttribute("aria-pressed", "false");
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (pts.size === 0) { multi = false; cancelAnimationFrame(glide); glide = 0; }
    if (e.pointerType !== "touch") return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { multi = true; start(); } else if (g) g = null;
  });
  const end = (e) => {
    if (!pts.delete(e.pointerId)) return;
    if (g && performance.now() - g.moved < 100) coast(g);   // fingers were still moving when lifted
    g = null;
  };
  canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);

  canvas.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (g) g.moved = performance.now();
    if (g && pts.size === 2 && !raf) raf = requestAnimationFrame(apply);   // each finger reports on its own; apply both together once a frame
  });

  function apply() {
    raf = 0;
    if (!g || pts.size !== 2) return;
    const [a, b] = two(), pa = g.a, pb = g.b; g.a = { ...a }; g.b = { ...b };
    const m = mid(a, b), pm = mid(pa, pb);
    const k = dist(pa, pb) / Math.max(1, dist(a, b)), th = wrap(ang(a, b) - ang(pa, pb));
    step(g.P, k, th, m.x - pm.x, m.y - pm.y);
    const now = performance.now(), f = Math.min(1, (now - g.t) / 50); g.t = now;   // remember how fast it was going (smoothed)
    const v = g.v, s = 0.5 + 0.5 * f;
    v.k = Math.pow(v.k, 1 - s) * Math.pow(k, s); v.th = v.th * (1 - s) + th * s;
    v.x = v.x * (1 - s) + (m.x - pm.x) * s; v.y = v.y * (1 - s) + (m.y - pm.y) * s;
  }

  function coast(G) {                                        // keep gliding after the fingers lift, slowing down each frame
    const v = { ...G.v }, P = G.P;
    const tick = () => {
      v.k = Math.pow(v.k, 0.9); v.th *= 0.9; v.x *= 0.9; v.y *= 0.9;
      if (Math.abs(Math.log(v.k)) < 0.0005 && Math.abs(v.th) < 0.0005 && Math.hypot(v.x, v.y) < 0.3) { glide = 0; return; }
      step(P, v.k, v.th, v.x, v.y);
      glide = requestAnimationFrame(tick);
    };
    glide = requestAnimationFrame(tick);
  }

  return { active: () => multi, stop: () => { cancelAnimationFrame(glide); glide = 0; } };   // active: a two-finger touch (so not a tap); stop: a view button was pressed
}

const touch = mapTouch(controls, camera, canvas, scene);

// Model units are metres, Y up, the 90 x 90 m site centred on the origin; the building is about 70 m wide, 11 m tall.
// Each view is a direction from the target; the distance is fitted so the building shows on any screen.
const VIEWS = {
  start: { dir: [-0.07, 0.08, 1], target: [-1, 5, 8], halfW: 25, halfH: 9 },   // like the coloring page: in front of the tower
  front: { dir: [0.2, 0.75, 1], target: [0, 2, 5], halfW: 42, halfH: 22 },      // the whole site from above the street
};
let current = VIEWS.start;
globalThis.__three = { camera, controls, scene, heli: () => heli };
globalThis.__look = (pos, target) => { camera.position.set(...pos); controls.target.set(...target); controls.update(); };
function setView(v) {
  touch.stop();
  current = v;
  const { halfW, halfH } = v;   // half extents to keep in frame, with a margin
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const d = Math.max(halfW / Math.tan(hfov / 2), halfH / Math.tan(vfov / 2));
  const dir = new THREE.Vector3(...v.dir).normalize();
  controls.target.set(...v.target);
  camera.position.copy(controls.target).addScaledVector(dir, d);
  controls.update();
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 55 : 40;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
setView(VIEWS.start);

// Plain ground that fades into the white page, with no outline.
scene.fog = new THREE.Fog(0xffffff, 380, 800);
const ground = new THREE.Mesh(new THREE.CircleGeometry(900, 64), new THREE.MeshBasicMaterial({ color: 0xf3f3f1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);

const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function loadTex(name, tile, dir = "textures") {
  const t = loader.load(`${dir}/${name}`);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (tile) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// ---------------- 3D props: trees, shrubs, cars, ambulances, helicopter ----------------
// Coloring-book style like the building: white solids, black outlines. Plan coords in metres (x along the front, y depth, z up).
// Trees, shrubs and cars are the same models as the school page.
const W0 = new THREE.MeshLambertMaterial({ color: 0xffffff, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const LINE = new THREE.LineBasicMaterial({ color: 0x000000 });
const M = { line: LINE };
let CX = 20, CY = 10, BASE = 0;
const V = (x, y, z) => new THREE.Vector3(x - CX, z + BASE, -(y - CY));   // site plan -> three (y up), on the raised site
const L = (x, y, z) => new THREE.Vector3(x, z, -y);               // a model's own frame: nose toward +y
const heli = { G: null, rotor: null, tail: null, z: 0 };

function buildProps(P, root) {
  [CX, CY] = P.centre; BASE = P.base || 0;
  // ---- low-poly tree: trunk + faceted crown (school)
  const crownG = new THREE.IcosahedronGeometry(1, 0), crownE = new THREE.EdgesGeometry(crownG, 1);
  const trunkG = new THREE.CylinderGeometry(0.18, 0.25, 1, 6);
  for (const [x, y, z0, h] of P.trees) {
    const r = h * 0.4;
    const t = new THREE.Mesh(trunkG, W0); t.scale.set(1, h - r, 1); t.position.copy(V(x, y, z0 + (h - r) / 2)); root.add(t);
    const te = new THREE.LineSegments(new THREE.EdgesGeometry(trunkG, 30), LINE); te.scale.copy(t.scale); te.position.copy(t.position); root.add(te);
    const c = new THREE.Mesh(crownG, W0); c.scale.set(r, r * 1.1, r); c.position.copy(V(x, y, z0 + h)); c.rotation.y = (x * 7 + y * 3) % 6.28; root.add(c);
    const ce = new THREE.LineSegments(crownE, LINE); ce.scale.copy(c.scale); ce.position.copy(c.position); ce.rotation.copy(c.rotation); root.add(ce);
  }
  const srand = (s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(777);
  const instances = (K) => { const n = K.at.length; if (!n) return;
    if (K.body) { const im = new THREE.InstancedMesh(K.body, W0, n); K.at.forEach((m, i) => im.setMatrixAt(i, m)); root.add(im); }
    const src = K.line, out = new Float32Array(src.length * n), v = new THREE.Vector3();
    K.at.forEach((m, i) => { for (let j = 0; j < src.length; j += 3) { v.set(src[j], src[j + 1], src[j + 2]).applyMatrix4(m); out[i * src.length + j] = v.x; out[i * src.length + j + 1] = v.y; out[i * src.length + j + 2] = v.z; } });
    const lg = new THREE.BufferGeometry(); lg.setAttribute("position", new THREE.BufferAttribute(out, 3)); root.add(new THREE.LineSegments(lg, LINE)); };
  // ---- shrubs: round bushes (clusters of balls) and grass tufts (blades only), school
  const VAR = [];
  for (let v = 0; v < 6; v++) { const ms = [], ls = [], n = 3 + Math.floor(srand() * 3);
    for (let i = 0; i < n; i++) { const a = srand() * 6.28, d = i ? 0.25 + srand() * 0.2 : 0, r = i ? 0.3 + srand() * 0.15 : 0.45;
      const m = new THREE.Matrix4().compose(new THREE.Vector3(Math.cos(a) * d, r * 0.85 + (i ? 0 : 0.1), Math.sin(a) * d), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, srand() * 6, 0)), new THREE.Vector3(r, r * 0.9, r));
      const g = new THREE.IcosahedronGeometry(1, 1); ls.push(new THREE.EdgesGeometry(g, 20).applyMatrix4(m)); g.applyMatrix4(m); g.deleteAttribute("uv"); ms.push(g); }
    VAR.push({ body: mergeGeometries(ms), line: mergeGeometries(ls).getAttribute("position").array, at: [] }); }
  const GRASS = [];
  for (let v = 0; v < 4; v++) { const q = [];
    for (let i = 0; i < 34; i++) { const a = srand() * 6.28, t = 0.25 + srand() * 0.55, h = 0.6 + srand() * 0.5, bx = Math.cos(a) * 0.12, bz = Math.sin(a) * 0.12;
      const mx = bx + Math.cos(a) * t * 0.5, mz = bz + Math.sin(a) * t * 0.5, tx = bx + Math.cos(a) * t, tz = bz + Math.sin(a) * t;
      q.push(bx, 0, bz, mx, h * 0.75, mz, mx, h * 0.75, mz, tx, h * (0.85 + srand() * 0.2), tz); }
    GRASS.push({ body: null, line: new Float32Array(q), at: [] }); }
  for (const [x, y, z, s, gr] of P.shrubs) { const set = gr ? GRASS : VAR;
    set[Math.floor(srand() * set.length)].at.push(new THREE.Matrix4().compose(V(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, srand() * 6.28, 0)), new THREE.Vector3(s, s * (0.85 + srand() * 0.3), s))); }
  [...VAR, ...GRASS].forEach(instances);

  // ---- shared little builders, in a model's own frame (x right, y forward, z up)
  function box(G, x0, x1, y0, y1, z0, z1, thr = 20) {
    const g = new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(z1 - z0), Math.abs(y1 - y0)); g.translate(...L((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2).toArray());
    return add(G, g, thr); }
  function add(G, g, thr = 20) { G.add(new THREE.Mesh(g, W0)); G.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, thr), LINE)); return g; }
  const shapeOf = (pts) => new THREE.Shape(pts.map(([a, b]) => new THREE.Vector2(a, b)));
  // a side-view shape (a = forward, b = up) extruded across x0..x1
  function sideShape(G, shape, x0, x1, opt = {}, thr = 20) {
    const g = new THREE.ExtrudeGeometry(shape, { depth: x1 - x0, bevelEnabled: false, curveSegments: 16, ...opt });
    g.rotateY(Math.PI / 2); g.translate(x0, 0, 0); return add(G, g, thr); }
  const side = (G, pts, x0, x1) => sideShape(G, shapeOf(pts), x0, x1);
  function lines(G, segs) { const pts = []; for (const [a, b] of segs) pts.push(L(...a), L(...b)); G.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), LINE)); }
  function cyl(G, x, y, z, r, len, axis = "z", seg = 20, rTop = r) {
    const g = new THREE.CylinderGeometry(rTop, r, len, seg);
    if (axis === "x") g.rotateZ(-Math.PI / 2); else if (axis === "y") g.rotateX(-Math.PI / 2);
    g.translate(...L(x, y, z).toArray()); return add(G, g, 40); }
  function rod(G, a, b, r = 0.04, seg = 6, rb = r) { const A = L(...a), B = L(...b), g = new THREE.CylinderGeometry(rb, r, A.distanceTo(B), seg);
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize())).translate(...A.clone().add(B).multiplyScalar(0.5).toArray()); return add(G, g, 30); }
  const rect = (x, y0, y1, z0, z1) => [[[x, y0, z0], [x, y1, z0]], [[x, y1, z0], [x, y1, z1]], [[x, y1, z1], [x, y0, z1]], [[x, y0, z1], [x, y0, z0]]];   // on a side face
  const frect = (y, x0, x1, z0, z1) => [[[x0, y, z0], [x1, y, z0]], [[x1, y, z0], [x1, y, z1]], [[x1, y, z1], [x0, y, z1]], [[x0, y, z1], [x0, y, z0]]]; // on a front / back face
  const cross = (cx, cz, a, b) => [[cx - b, cz + a], [cx + b, cz + a], [cx + b, cz + b], [cx + a, cz + b], [cx + a, cz - b], [cx + b, cz - b], [cx + b, cz - a], [cx - b, cz - a], [cx - b, cz - b], [cx - a, cz - b], [cx - a, cz + b], [cx - b, cz + b]];

  // ---- parked cars (school TCAR: sedan, hatchback, SUV), baked once per kind and repeated as instances
  const TCAR = (() => {
    const CARS = {
      sedan: { hl: 2.33, wf: 1.45, wr: -1.42, r: 0.33, sill: 0.28, belt: 0.9, roof: 1.44, cf: 0.92, rf: 0.05, rr: -0.95, cb: -1.72, deck: true, w: 0.92 },
      hatch: { hl: 2.13, wf: 1.33, wr: -1.33, r: 0.32, sill: 0.28, belt: 0.9, roof: 1.45, cf: 0.85, rf: 0.02, rr: -1.55, cb: -2.02, deck: false, w: 0.9 },
      suv:   { hl: 2.25, wf: 1.38, wr: -1.38, r: 0.37, sill: 0.42, belt: 1.08, roof: 1.72, cf: 1.0, rf: 0.3, rr: -1.85, cb: -2.12, deck: false, w: 0.93 },
    };
    const bx = (G, x0, x1, y0, y1, z0, z1) => { const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(z1 - z0), Math.abs(y1 - y0)), W0); m.position.copy(L((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)); G.add(m); };
    const sS = (G, shape, x0, x1) => { const g = new THREE.ExtrudeGeometry(shape, { depth: x1 - x0, bevelEnabled: false, curveSegments: 24 }); g.rotateY(Math.PI / 2); const m = new THREE.Mesh(g, W0); m.position.x = x0; G.add(m); };
    const sd = (G, pts, x0, x1) => sS(G, shapeOf(pts), x0, x1);
    const cy = (G, x, y, z, r, len, seg) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), W0); m.rotation.z = -Math.PI / 2; m.position.copy(L(x, y, z)); G.add(m); };
    const ln = (G, segs) => { const pts = []; for (const [a, b] of segs) pts.push(L(...a), L(...b)); G.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), LINE)); };
    function car(G, kind) {
      const C = CARS[kind], { hl, wf, wr, r, sill, belt, roof, cf, rf, rr, cb, w } = C, ra = r + 0.07;

try {
  const res = await fetch("model.json");
  if (!res.ok) throw new Error(res.status);
  const model = await res.json();
  const building = new THREE.Group();
  for (const g of model.groups) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(g.pos, 3));
    if (g.tex) geo.setAttribute("uv", new THREE.Float32BufferAttribute(g.uv, 2));
    geo.computeVertexNormals();
    const mat = new THREE.MeshLambertMaterial({
      color: 0xffffff,
      map: g.tex ? loadTex(`${g.key}.png`, g.tile) : null,
      side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,  // keep outlines on top
    });
    building.add(new THREE.Mesh(geo, mat));
  }
  const eg = new THREE.BufferGeometry();
  eg.setAttribute("position", new THREE.Float32BufferAttribute(model.edges, 3));
  building.add(new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x000000 })));
  scene.add(building);

  buildProps(model.props, scene);
  status.remove();
} catch (e) {
  status.textContent = "Couldn't load the model. Please refresh the page.";
}

};

document.getElementById("reset").onclick = () => setView(VIEWS.start);

const hint = document.getElementById("hint");
controls.addEventListener("start", () => { hint.style.opacity = 0; }, { once: true });

renderer.setAnimationLoop(() => {
  controls.update();
  if (heli.G) { const t = performance.now() / 1000; heli.rotor.rotation.y = t * 9; heli.tail.rotation.x = t * 20; heli.G.position.y = heli.z + Math.sin(t * 0.9) * 0.25; }
  renderer.render(scene, camera);
});
