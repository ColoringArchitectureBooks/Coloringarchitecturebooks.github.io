<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fire Station 3D Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Deliberately single-theme: the model is a white coloring page, so the page stays paper-white. */
  :root { --paper:#ffffff; --ink:#1a1a1a; --muted:#6b6b6b; color-scheme: light; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  header { position:fixed; top:0; left:0; right:0; padding-top:max(14px, env(safe-area-inset-top, 0px));
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); pointer-events:none; }
  h1 { margin:0; font-size:17px; font-weight:700; }
  .sub { margin-top:2px; font-size:13px; color:var(--muted); }
  .bar { position:fixed; left:50%; transform:translateX(-50%); bottom:max(16px, env(safe-area-inset-bottom, 0px));
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:max-content; max-width:calc(100% - 32px); }
  button { font:inherit; font-size:14px; border:1.5px solid var(--ink); background:var(--paper); color:var(--ink);
    border-radius:999px; padding:9px 16px; cursor:pointer; white-space:nowrap; }
  button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .hint { position:fixed; left:0; right:0; bottom:calc(max(16px, env(safe-area-inset-bottom, 0px)) + 52px);
    text-align:center; font-size:13px; color:var(--muted); pointer-events:none; transition:opacity .6s; }
  #status { position:fixed; inset:0; display:grid; place-items:center; font-size:15px; color:var(--muted); }
</style>

<canvas id="c"></canvas>
<header>
  <h1>Fire Station 3D Model</h1>
</header>
<div id="status">Loading the building…</div>
<div class="hint" id="hint">Drag to turn the fire station, pinch to zoom</div>
<div class="bar">
  <button id="v-front">Front</button>
  <button id="v-obl">Aerial</button>
  <button id="spin" aria-pressed="false">Spin</button>
  <button id="call">Fire call</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { mapTouch } from "./touch.js?v=4";
import { buildScene, V, FIRE } from "./scene.js?v=14";
import { sirenStart, sirenUpdate, sirenStop } from "./siren.js?v=3";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(34, 1, 0.5, 2000);
const controls = new OrbitControls(camera, canvas);
const touch = mapTouch(controls, camera, canvas, scene);   // two fingers: turn like one finger, pinch to zoom toward the fingers
controls.enableDamping = true; controls.minDistance = 4; controls.maxDistance = 400;
controls.maxPolarAngle = Math.PI / 2 - 0.02; controls.autoRotateSpeed = 1.0;

const VIEWS = {
  front: { eye: [12.5, -60, 7.5], tgt: [12.5, 0, 7] },
  obl:   { eye: [105, -75, 45], tgt: [30, 20, 2] },
  back:  { eye: [-40, 120, 50], tgt: [25, 40, 3] },
  entry: { eye: [92, -6, 7], tgt: [52, 9, 6] },
};
function setView(k) { touch.stop(); const v = VIEWS[k]; camera.position.copy(V(...v.eye)); controls.target.copy(V(...v.tgt)); controls.update(); }
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 58 : 34; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize); resize();
setView("front");
buildScene(scene).then(() => document.getElementById("status").remove())
  .catch(() => { document.getElementById("status").textContent = "Couldn't load the model. Please refresh the page."; });

for (const k of Object.keys(VIEWS)) if (document.getElementById("v-" + k)) document.getElementById("v-" + k).onclick = () => setView(k);
const spinBtn = document.getElementById("spin");
spinBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; spinBtn.setAttribute("aria-pressed", controls.autoRotate); };
const hint = document.getElementById("hint");
controls.addEventListener("start", () => { hint.style.opacity = 0; }, { once: true });
// fire call: the engine in bay 1 drives out with the siren on and its lights flashing; it comes back to its bay afterwards
const callBtn = document.getElementById("call");
callBtn.onclick = () => { if (!FIRE.start()) return; sirenStart(); callBtn.setAttribute("aria-pressed", "true"); };
FIRE.onEnd = () => { sirenStop(); callBtn.setAttribute("aria-pressed", "false"); };
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const p = FIRE.tick(dt);
  if (p) {   // how far the truck is, and whether it is to the left or right of the view, for the sound
    const d = camera.position.distanceTo(p), right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    sirenUpdate(d, FIRE.v, right.dot(p.clone().sub(camera.position)) / Math.max(1, d));
  }
  controls.update(); renderer.render(scene, camera);
});
</script>
</html>
