<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Police Station 3D Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Deliberately single-theme: the model is a white coloring page, so the page stays paper-white. */
  :root { --paper:#ffffff; --ink:#1a1a1a; --muted:#6b6b6b; --chip:#f3f3f1; --line:#d9d9d6; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  header { position:fixed; top:0; left:0; right:0; padding:max(14px, env(safe-area-inset-top)) 16px 0;
    pointer-events:none; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1 { margin:0; font-size:17px; font-weight:700; letter-spacing:.01em; }
  .sub { margin-top:2px; font-size:13px; color:var(--muted); }
  .bar { position:fixed; left:50%; transform:translateX(-50%); bottom:max(16px, env(safe-area-inset-bottom));
    display:flex; gap:8px; }
  button { font:inherit; font-size:14px; border:1.5px solid var(--ink); background:var(--paper); color:var(--ink);
    border-radius:999px; padding:9px 16px; cursor:pointer; white-space:nowrap; }
  button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .hint { position:fixed; left:0; right:0; bottom:calc(max(16px, env(safe-area-inset-bottom)) + 52px);
    text-align:center; font-size:13px; color:var(--muted); pointer-events:none; transition:opacity .6s; }
  #status { position:fixed; inset:0; display:grid; place-items:center; font-size:15px; color:var(--muted); }
</style>

<canvas id="c"></canvas>
<header>
  <div>
    <h1>Police Station 3D Model</h1>
    <div class="sub">Coloring book · page 1</div>
  </div>
</header>
<div id="status">Loading the building…</div>
<div class="hint" id="hint" dir="rtl">اسحب بصباعك عشان تلف المبنى، وقرّب بصباعين</div>
<div class="bar">
  <button id="spin" aria-pressed="false">Spin</button>
  <button id="front">Front</button>
  <button id="reset">Reset view</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const canvas = document.getElementById("c");
const status = document.getElementById("status");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.add(new THREE.HemisphereLight(0xffffff, 0xeeeeee, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(-20, 40, 35);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 600);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 8;
controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI / 2 - 0.03;   // stay above the ground
controls.autoRotateSpeed = 1.2;

// Model units are metres, Y up, building centred on the origin (about 37 m wide, 9 m tall).
// Each view is a direction from the target; the distance is fitted so the whole building shows on any screen.
const VIEWS = {
  start: { dir: [-0.28, 0.14, 1], target: [1.5, 4, 4] },   // like the coloring page: front-left, near eye level
  front: { dir: [0, 0.05, 1], target: [0, 4, 4] },
};
let current = VIEWS.start;
function setView(v) {
  current = v;
  const halfW = 25, halfH = 10;   // half extents to keep in frame, with a margin
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const d = Math.max(halfW / Math.tan(hfov / 2), halfH / Math.tan(vfov / 2));
  const dir = new THREE.Vector3(...v.dir).normalize();
  controls.target.set(...v.target);
  camera.position.copy(controls.target).addScaledVector(dir, d);
  controls.update();
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 55 : 40;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
setView(VIEWS.start);

// Plain ground that fades into the white page, with no outline.
scene.fog = new THREE.Fog(0xffffff, 140, 320);
const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 64), new THREE.MeshBasicMaterial({ color: 0xf3f3f1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);

const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function loadTex(name, tile) {
  const t = loader.load(`textures/${name}.png`);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (tile) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

try {
  const res = await fetch("model.json");
  if (!res.ok) throw new Error(res.status);
  const model = await res.json();
  const building = new THREE.Group();
  for (const g of model.groups) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(g.pos, 3));
    if (g.tex) geo.setAttribute("uv", new THREE.Float32BufferAttribute(g.uv, 2));
    geo.computeVertexNormals();
    const mat = new THREE.MeshLambertMaterial({
      color: g.tex ? 0xffffff : new THREE.Color(g.key),
      map: g.tex ? loadTex(g.key, g.tile) : null,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,  // keep outlines on top
    });
    building.add(new THREE.Mesh(geo, mat));
  }
  const eg = new THREE.BufferGeometry();
  eg.setAttribute("position", new THREE.Float32BufferAttribute(model.edges, 3));
  building.add(new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x000000 })));
  scene.add(building);
  status.remove();
} catch (e) {
  status.textContent = "Couldn't load the model. Please refresh the page.";
}

const spinBtn = document.getElementById("spin");
spinBtn.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.setAttribute("aria-pressed", controls.autoRotate);
};
document.getElementById("front").onclick = () => setView(VIEWS.front);
document.getElementById("reset").onclick = () => setView(VIEWS.start);

const hint = document.getElementById("hint");
controls.addEventListener("start", () => { hint.style.opacity = 0; }, { once: true });

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
